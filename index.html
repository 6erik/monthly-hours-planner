<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5f8">
    <meta name="description" content="A simple monthly work-hours planner.">
    <title>Monthly Hours Planner</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <span class="app-name">Monthly Hours Planner</span>
        <div class="topbar-actions">
          <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
            <span class="theme-toggle-icon" aria-hidden="true">☾</span>
            <span>Dark mode</span>
          </button>
          <span class="local-note"><span class="local-dot" aria-hidden="true"></span> Saved in this browser</span>
        </div>
      </header>

      <main id="app" class="main-content" aria-live="polite"></main>

      <footer class="footer">
        <span>Your schedule is stored locally in this browser.</span>
      </footer>
    </div>
  </body>
</html>
